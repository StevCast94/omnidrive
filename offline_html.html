<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sin conexión — OmniDrive</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0F172A;
      color: #fff;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .card {
      background: #1E293B;
      border: 1px solid #334155;
      border-radius: 1.5rem;
      padding: 3rem 2rem;
      text-align: center;
      max-width: 380px;
      width: 100%;
    }
    .emoji { font-size: 4rem; margin-bottom: 1.5rem; }
    h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.75rem; }
    p  { color: #94A3B8; font-size: 0.9rem; line-height: 1.6; margin-bottom: 2rem; }
    button {
      background: #4F46E5;
      color: #fff;
      border: none;
      border-radius: 0.75rem;
      padding: 0.75rem 2rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background 0.2s;
    }
    button:hover { background: #4338CA; }
  </style>
</head>
<body>
  <div class="card">
    <div class="emoji">🚗</div>
    <h1>Sin conexión</h1>
    <p>No tienes acceso a Internet en este momento. Verifica tu conexión y vuelve a intentarlo.</p>
    <button onclick="window.location.reload()">Reintentar</button>
  </div>
</body>
</html>
