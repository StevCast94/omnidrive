<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ── Primary meta ──────────────────────────────────────── -->
  <title>OmniDrive — Renta de vehículos P2P en Ecuador</title>
  <meta name="description"
        content="Alquila autos, motos, camionetas y más con o sin chofer. La plataforma P2P de vehículos más confiable de Ecuador."/>
  <meta name="keywords"
        content="renta de autos Ecuador, alquiler vehículos Quito, car rental Ecuador, P2P vehículos"/>
  <meta name="author"     content="OmniDrive"/>
  <meta name="theme-color" content="#0f172a"/>
  <meta name="color-scheme" content="dark"/>

  <!-- ── Favicon ───────────────────────────────────────────── -->
  <link rel="icon"             href="/favicon.ico"                   type="image/x-icon"/>
  <link rel="icon"             href="/icons/favicon.png"             type="image/png" sizes="32x32"/>
  <link rel="icon"             href="/icons/icon-96.png"             type="image/png" sizes="96x96"/>
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png"    sizes="180x180"/>
  <link rel="mask-icon"        href="/logo.svg"                      color="#06b6d4"/>

  <!-- ── PWA ───────────────────────────────────────────────── -->
  <link rel="manifest" href="/manifest.json"/>

  <!-- ── Open Graph ────────────────────────────────────────── -->
  <meta property="og:type"        content="website"/>
  <meta property="og:url"         content="https://omnidrive.ec/"/>
  <meta property="og:site_name"   content="OmniDrive"/>
  <meta property="og:title"       content="OmniDrive — Renta de vehículos P2P"/>
  <meta property="og:description" content="Alquila autos, motos y más con o sin chofer. Pagos P2P, GPS en vivo, confianza verificada."/>
  <meta property="og:image"       content="https://omnidrive.ec/og-image.png"/>
  <meta property="og:image:width"  content="1200"/>
  <meta property="og:image:height" content="630"/>
  <meta property="og:locale"      content="es_EC"/>

  <!-- ── Twitter / X Card ──────────────────────────────────── -->
  <meta name="twitter:card"        content="summary_large_image"/>
  <meta name="twitter:site"        content="@omnidrive_ec"/>
  <meta name="twitter:title"       content="OmniDrive — Renta de vehículos P2P"/>
  <meta name="twitter:description" content="Alquila autos, motos y más con o sin chofer. Pagos P2P, GPS en vivo, confianza verificada."/>
  <meta name="twitter:image"       content="https://omnidrive.ec/og-image.png"/>

  <!-- ── Preconnect a servicios externos ───────────────────── -->
  <link rel="preconnect" href="https://api.mapbox.com"/>
  <link rel="preconnect" href="https://events.mapbox.com"/>
  <link rel="preconnect" href="https://js.stripe.com"/>

  <!-- ── Seguridad ─────────────────────────────────────────── -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff"/>
  <meta name="referrer" content="strict-origin-when-cross-origin"/>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
