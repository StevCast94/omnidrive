name: Backup BD diario

# Un backup no vale nada hasta que se restaura. Este workflow hace, en orden:
#   dump -> verifica tamaño -> RESTAURA en un Postgres desechable -> comprueba filas -> sube.
# Si el restore falla, el backup NO se sube y el workflow falla ruidosamente.

on:
  schedule:
    # 08:00 UTC = 03:00 GMT-5 (Ecuador), baja actividad
    - cron: '0 8 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write   # para abrir un issue si el backup falla

jobs:
  backup:
    runs-on: ubuntu-latest

    services:
      verify-db:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: verify
          POSTGRES_DB: verify
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Instalar cliente PostgreSQL 16
        run: |
          set -euo pipefail
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16 jq

      - name: Generar dump completo (esquema + datos)
        env:
          # DIRECT_URL es la conexión directa (sin pgbouncer). pg_dump no funciona
          # contra el pooler en modo transaction. Si no existe, cae a DATABASE_URL.
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail          # <- sin esto, un pg_dump que falla pasa por éxito
          SRC="${DIRECT_URL:-$DATABASE_URL}"
          SRC="${SRC%%\?*}"          # quita ?pgbouncer=true y demás parámetros
          STAMP=$(date +%Y-%m-%d_%H%M)
          FILE="omnidrive-backup-${STAMP}.sql.gz"
          echo "FILE=${FILE}"            >> "$GITHUB_ENV"
          echo "PUBLIC_ID=omnidrive-backup-${STAMP}" >> "$GITHUB_ENV"

          pg_dump --no-owner --no-privileges --format=plain "$SRC" > dump.sql
          gzip -9 -c dump.sql > "$FILE"

          BYTES=$(stat -c%s dump.sql)
          echo "Dump sin comprimir: ${BYTES} bytes"
          # Un dump real de este esquema pasa holgadamente de 20 KB.
          # Un gzip vacío son 20 bytes: ese es exactamente el fallo que enmascaró
          # este workflow durante 14 ejecuciones "exitosas".
          if [ "$BYTES" -lt 20000 ]; then
            echo "::error::Dump sospechosamente pequeño (${BYTES} bytes). Abortando."
            exit 1
          fi

      - name: Restaurar en Postgres desechable y comprobar
        env:
          PGPASSWORD: verify
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d verify -v ON_ERROR_STOP=1 -q -f dump.sql

          # El backup sólo sirve si las tablas con datos de negocio llegan pobladas.
          for T in User Vehicle Booking; do
            N=$(psql -h localhost -U postgres -d verify -tAc "SELECT count(*) FROM public.\"$T\";")
            echo "  $T restaurada con $N filas"
            if [ "$N" -lt 1 ]; then
              echo "::error::La tabla $T quedó vacía tras el restore. El backup no sirve."
              exit 1
            fi
          done

          # Comprobación explícita de las tablas que el script antiguo omitía
          # (Transaction es el libro mayor: perderlo es perder la contabilidad).
          for T in Transaction UserDocument BannedIdentity Review Notification; do
            psql -h localhost -U postgres -d verify -tAc "SELECT count(*) FROM public.\"$T\";" >/dev/null \
              || { echo "::error::La tabla $T no existe en el dump."; exit 1; }
          done
          echo "Restore verificado."

      - name: Subir a Cloudinary (omnidrive/backups)
        env:
          CLOUD: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          set -euo pipefail
          TS=$(date +%s)
          FOLDER="omnidrive/backups"
          TO_SIGN="folder=${FOLDER}&public_id=${PUBLIC_ID}&timestamp=${TS}"
          SIG=$(printf '%s' "${TO_SIGN}${API_SECRET}" | sha1sum | awk '{print $1}')
          RES=$(curl -s "https://api.cloudinary.com/v1_1/${CLOUD}/raw/upload" \
            -F "file=@${FILE}" \
            -F "api_key=${API_KEY}" \
            -F "timestamp=${TS}" \
            -F "public_id=${PUBLIC_ID}" \
            -F "folder=${FOLDER}" \
            -F "signature=${SIG}")
          echo "$RES" | jq -e '.secure_url' > /dev/null || { echo "::error::Fallo subida: $RES"; exit 1; }
          UPLOADED=$(echo "$RES" | jq -r '.bytes')
          echo "Backup subido: $(echo "$RES" | jq -r '.secure_url') (${UPLOADED} bytes)"
          if [ "$UPLOADED" -lt 1000 ]; then
            echo "::error::Cloudinary registró ${UPLOADED} bytes. Subida vacía."
            exit 1
          fi

      - name: Retención (borrar backups > 14 días)
        env:
          CLOUD: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          set -euo pipefail
          CUTOFF=$(date -u -d '14 days ago' +%s)
          LIST=$(curl -s -u "${API_KEY}:${API_SECRET}" \
            "https://api.cloudinary.com/v1_1/${CLOUD}/resources/raw?type=upload&prefix=omnidrive/backups&max_results=500")
          OLD=$(echo "$LIST" | jq -r --argjson cutoff "$CUTOFF" \
            '.resources[] | select((.created_at | fromdateiso8601) < $cutoff) | .public_id')
          if [ -z "$OLD" ]; then echo "Nada que purgar."; exit 0; fi
          for PID in $OLD; do
            echo "Borrando antiguo: $PID"
            curl -s -X DELETE -u "${API_KEY}:${API_SECRET}" \
              --data-urlencode "public_ids[]=${PID}" \
              "https://api.cloudinary.com/v1_1/${CLOUD}/resources/raw/upload" > /dev/null
          done
          echo "Retención completada."

      # El fallo silencioso fue el problema real: 14 ejecuciones "exitosas" sin backup.
      # Un issue es visible y no depende de configurar ningún canal externo.
      - name: Avisar si algo falló
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fecha = new Date().toISOString().slice(0, 10);
            const titulo = `Backup de BD falló (${fecha})`;
            const abiertos = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'backup',
            });
            if (abiertos.data.length > 0) {
              console.log('Ya hay un issue de backup abierto; no se duplica.');
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: titulo,
              labels: ['backup'],
              body: [
                'El backup diario falló y **no se subió ningún archivo**.',
                '',
                `Ejecución: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Mientras este issue siga abierto, la base de producción está sin copia del día.',
              ].join('\n'),
            });
