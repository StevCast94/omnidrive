name: Retencion de datos

# Borra los puntos de ubicacion pasados los 90 dias, en los dos paises.
#
# La ubicacion es dato personal sensible bajo la LOPDP ecuatoriana y la Ley
# 172-13 dominicana: prometemos en la politica de privacidad que se borran a
# los 90 dias, y esto es lo que cumple esa promesa.

on:
  schedule:
    - cron: '0 9 * * *'   # 04:00 GMT-5, despues del backup
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  limpiar:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        pais:
          - { codigo: ec, nombre: Ecuador }
          - { codigo: do, nombre: Republica Dominicana }

    name: Retencion ${{ matrix.pais.nombre }}

    steps:
      - name: Cliente PostgreSQL 18
        run: |
          set -euo pipefail
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update && sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Borrar puntos de mas de 90 dias
        env:
          URL: ${{ matrix.pais.codigo == 'do' && secrets.DIRECT_URL_DO || secrets.DIRECT_URL }}
        run: |
          set -euo pipefail
          BORRADOS=$(psql "${URL%%\?*}" -tAc \
            "WITH borrados AS (
               DELETE FROM \"TrackingPoint\"
               WHERE \"recordedAt\" < now() - interval '90 days'
               RETURNING 1
             ) SELECT count(*) FROM borrados;")
          echo "Puntos borrados en ${{ matrix.pais.nombre }}: $BORRADOS"

          QUEDAN=$(psql "${URL%%\?*}" -tAc "SELECT count(*) FROM \"TrackingPoint\";")
          VIEJOS=$(psql "${URL%%\?*}" -tAc \
            "SELECT count(*) FROM \"TrackingPoint\" WHERE \"recordedAt\" < now() - interval '90 days';")
          echo "Quedan $QUEDAN puntos, de los cuales $VIEJOS superan la retencion."

          # Si despues de borrar siguen quedando puntos viejos, algo no funciona
          # y la promesa de la politica de privacidad no se esta cumpliendo.
          [ "$VIEJOS" = "0" ] || { echo "::error::Quedan $VIEJOS puntos por encima de la retencion"; exit 1; }

      - name: Avisar si fallo
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const abiertos = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'retencion',
            });
            if (abiertos.data.length > 0) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Retención de ubicación falló — ${{ matrix.pais.nombre }}`,
              labels: ['retencion'],
              body: [
                'La limpieza de puntos de ubicación no se completó.',
                '',
                'Mientras esto falle, estamos guardando ubicaciones más allá de los 90 días',
                'que promete la política de privacidad.',
                '',
                `Ejecución: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n'),
            });
